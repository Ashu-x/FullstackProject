<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RealTrust</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h2>RealTrust</h2>
            <nav>
                <a href="#projects">Projects</a>
                <a href="#clients">Clients</a>
                <a href="#contact">Contact</a>
                <button onclick="window.location.href='admin.html'" class="admin-btn">
                    Admin Panel
                </button>
            </nav>

    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Consultation, Design & Marketing</h1>
        <p>We build trust through innovation</p>
        <button>Explore Projects</button>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section">
        <h2>Our Projects</h2>
        <div class="grid" id="projectsContainer">
            <p>No project yet</p>
        </div>
    </section>

    <!-- CLIENTS -->
    <section id="clients" class="section light">
        <h2>Happy Clients</h2>
        <div class="grid" id="clientsContainer">
            <p>No Client yet</p>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section">
        <h2>Get In Touch</h2>
        <form id="contactForm">
            <input type="text" placeholder="Full Name" id="name" required>
            <input type="email" placeholder="Email" id="email" required>
            <input type="tel" placeholder="Mobile" id="mobile" required>
            <input type="text" placeholder="City" id="city" required>
            <button type="submit">Submit</button>
        </form>
        <p id="contactMsg"></p>
    </section>

    <!-- NEWSLETTER -->
    <section class="newsletter">
        <h2>Subscribe to Newsletter</h2>
        <form id="newsletterForm">
            <input type="email" placeholder="Enter email" id="newsletterEmail" required>
            <button type="submit">Subscribe</button>
        </form>
        <p id="newsletterMsg"></p>
    </section>

    <section id="adminPanel" class="section" style="display:none;">
        <h2>Admin Panel</h2>
    
        <h3>Projects</h3>
        <div id="adminProjects"></div>
    
        <h3>Clients</h3>
        <div id="adminClients"></div>
    </section>


    <script src="script.js"></script>
</body>

</html>
